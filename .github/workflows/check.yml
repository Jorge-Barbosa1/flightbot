name: flight-watch

on:
  schedule:
    - cron: "0 7,13,19 * * *"     # 3x por dia (UTC)
    - cron: "30 8 * * *"          # resumo diário (UTC)
  workflow_dispatch:
    inputs:
      summary:
        description: "Enviar resumo em vez de alertas"
        type: boolean
        default: false

permissions:
  contents: write   # para guardar data/state.json e data/history.csv

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_SUMMARY: ${{ (github.event.schedule == '30 8 * * *') || (github.event_name == 'workflow_dispatch' && inputs.summary) }}
        run: |
          if [ "$IS_SUMMARY" = "true" ]; then
            python src/flightwatch.py --summary
          else
            python src/flightwatch.py
          fi
      - name: Guardar histórico
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "flightwatch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: atualizar preços" && git push)
