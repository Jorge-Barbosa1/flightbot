name: flight-watch

on:
  # Os agendamentos (3x por dia + resumo diário) vêm do Cloudflare Worker
  # (discord-worker/wrangler.toml), que chama este workflow à hora certa.
  workflow_dispatch:
    inputs:
      ida:
        description: "Pedido à medida - dia(s) de ida, ex. 23/04 ou 23/04 a 24/04 (vazio = corrida normal)"
        type: string
        default: ""
      volta:
        description: "Pedido à medida - dia(s) de volta, ex. 01/05 ou 30/04 a 01/05"
        type: string
        default: ""
      top:
        description: "Pedido à medida - quantas viagens mostrar"
        type: string
        default: "3"
      hora:
        description: "Pedido à medida - só idas a partir desta hora, ex. 17 (vazio = qualquer hora)"
        type: string
        default: ""
      summary:
        description: "Corrida normal: enviar resumo em vez de alertas"
        type: boolean
        default: false
      pedido:
        description: "Uso interno: pedido dos comandos do Discord (JSON). Deixa vazio."
        type: string
        default: ""

permissions:
  contents: write   # para guardar data/state.json e data/legs.csv

concurrency:
  # os pedidos do Discord correm à parte, para não ficarem à espera (nem serem
  # substituídos) atrás das corridas agendadas
  group: ${{ inputs.pedido != '' && format('pedido-{0}', github.run_id) || 'flight-watch' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IS_SUMMARY: ${{ inputs.summary }}
          IDA: ${{ inputs.ida }}
          VOLTA: ${{ inputs.volta }}
          TOP: ${{ inputs.top }}
          HORA: ${{ inputs.hora }}
          PEDIDO: ${{ inputs.pedido }}
        run: |
          if [ -n "$PEDIDO" ]; then
            echo "::add-mask::$(echo "$PEDIDO" | jq -r '.token // empty')"
            python src/flightwatch.py --pedido-json "$PEDIDO"
          elif [ -n "$IDA" ]; then
            python src/flightwatch.py --ida "$IDA" --volta "$VOLTA" --top "${TOP:-3}" ${HORA:+--hora "$HORA"}
          elif [ "$IS_SUMMARY" = "true" ]; then
            python src/flightwatch.py --summary
          else
            python src/flightwatch.py
          fi
      - name: Avisar no Discord se falhar
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          msg="⚠️ **Uma execução do FlightBot rebentou.** Detalhes: <$RUN_URL>"
          curl -sS -H "Content-Type: application/json" -d "{\"content\": \"$msg\"}" "$DISCORD_WEBHOOK_URL"
      - name: Guardar histórico
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "flightwatch-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "data: atualizar preços"
          # outra corrida (ex. um /vigiar) pode ter feito push entretanto: tenta algumas vezes
          for i in 1 2 3 4 5; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
