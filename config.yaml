# Koningsdag (Dia do Rei) 2027 = terça-feira, 27 de abril.
# A véspera (Koningsnacht, 26 abril) também é grande festa -> convém lá estar nessa noite.

origin: OPO

# Aeroportos onde se pode chegar/partir. A ida e a volta são pesquisadas em separado
# (só ida), por isso podem ser de aeroportos e companhias diferentes.
# ground_cost = estimativa por pessoa, só ida, do aeroporto até Amesterdão (comboio/autocarro).
# São ESTIMATIVAS de bilhete comprado com antecedência: confirma em ns.nl / bahn.de /
# belgiantrain.be / flibco.com antes de comprar e ajusta aqui.
airports:
  AMS: {name: Amesterdão, ground_cost: 0}
  EIN: {name: Eindhoven, ground_cost: 20, ground_time: "~1h30"}
  NRN: {name: "Weeze, Alemanha", ground_cost: 30, ground_time: "~2h30 (autocarro + comboio via Nijmegen)"}
  DUS: {name: "Düsseldorf, Alemanha", ground_cost: 40, ground_time: "~2h30"}
  CGN: {name: "Colónia, Alemanha", ground_cost: 45, ground_time: "~3h"}
  BRU: {name: "Bruxelas, Bélgica", ground_cost: 40, ground_time: "~2h45"}
  CRL: {name: "Charleroi, Bélgica", ground_cost: 55, ground_time: "~3h30 (autocarro + comboio via Bruxelas)"}
  # Paris (BVA/CDG) e Roterdão (RTM) testados e deixados de fora: Paris fica a 3h20+ de
  # comboio caro, e o Google não devolve voos OPO-RTM.

dates:
  # Janelas de datas (inclusive). O script testa todas as combinações ida/volta
  # que respeitem o nº de noites abaixo.
  outbound: [2027-04-24, 2027-04-26]
  return:   [2027-04-28, 2027-04-30]
  min_nights: 2
  max_nights: 6

search:
  passengers: 2          # só serve para mostrar o total estimado nas mensagens
  currency: EUR
  max_stops: 1           # null = sem limite
  carry_on_bags: 0       # low-cost: bagagem de mão grande/porão muda o preço, ajusta aqui
  checked_bags: 0
  delay_seconds: 3       # pausa entre pesquisas (não abuses do Google)

alerts:
  # Total por pessoa: voo de ida + voo de volta + comboio/autocarro até Amesterdão (ida e volta).
  max_price_per_person: 180
  min_drop_to_realert: 5       # só volta a alertar as mesmas datas se baixar >= 5 EUR
  summary_top_n: 5

# Segurança para não fazer pesquisas a mais por execução.
max_queries_per_run: 60
