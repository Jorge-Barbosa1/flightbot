# Koningsdag (Dia do Rei) 2027 = terça-feira, 27 de abril.
# A véspera (Koningsnacht, 26 abril) também é grande festa -> convém lá estar nessa noite.

origin: OPO
origin_name: Porto

# Outros aeroportos de onde se pode partir, com o transporte desde o Porto
# (por pessoa, cada sentido). lead_hours = horas a mais para lá chegar: somam-se
# à hora mínima de partida da ida e tiram-se à hora máxima de chegada da volta.
# Nos pedidos do Discord: origem:"OPO,LIS" ou origem:todas.
origins:
  LIS: {name: Lisboa, ground_cost: 30, lead_hours: 4, ground_time: "~3h Alfa Pendular/IC até Lisboa Oriente + metro"}
  VGO: {name: Vigo, ground_cost: 15, lead_hours: 3, ground_time: "~2h30 de autocarro (Alsa/FlixBus)"}
  SCQ: {name: Santiago de Compostela, ground_cost: 25, lead_hours: 4, ground_time: "~3h30 de autocarro"}

# Na vigilância do Koningsdag, de que outras origens pesquisar e para que aeroportos.
# Testado a 21 out 2026: de Lisboa a Transavia para AMS sai bem mais barata (54 € vs 88 €);
# Vigo e Santiago só têm voos com escala e mais caros, por isso ficam de fora.
extra_origins:
  LIS: [AMS, BRU, CRL]

# Feriados municipais (MM-DD) que contam para os "feriados"/"pontes" do /explorar e /flight.
local_holidays:
  "06-24": São João

# Cidade para os links de alojamento (Booking/Airbnb) nas mensagens do Koningsdag.
stay_city: Amsterdam

# Aeroportos onde se pode chegar/partir. A ida e a volta são pesquisadas em separado
# (só ida), por isso podem ser de aeroportos e companhias diferentes.
# ground_cost = custo por pessoa, só ida, do aeroporto até Amesterdão Centraal.
# Valores pesquisados a 20 out 2026 (NS, NS International, DB, Flibco, Rome2rio), para bilhetes
# comprados com algumas semanas de antecedência, com folga porque no Koningsdag os comboios enchem.
airports:
  AMS: {name: Amesterdão, ground_cost: 0}
  EIN: {name: Eindhoven, ground_cost: 30, ground_time: "~1h45: autocarro 400/401 até à estação + comboio NS (~26 €, preço fixo)"}
  NRN: {name: "Weeze, Alemanha", ground_cost: 35, ground_time: "~2h50: autocarro SB46 até Nijmegen + comboio NS (~24 €)"}
  DUS: {name: "Düsseldorf, Alemanha", ground_cost: 35, ground_time: "~2h30: ICE direto do aeroporto (DB Sparpreis desde ~20 €)"}
  CGN: {name: "Colónia, Alemanha", ground_cost: 40, ground_time: "~3h: S-Bahn até Köln Hbf + ICE (DB Sparpreis desde ~20 €)"}
  BRU: {name: "Bruxelas, Bélgica", ground_cost: 45, ground_time: "~3h: comboio até Bruxelas + Eurocity Direct (desde 25 €)"}
  CRL: {name: "Charleroi, Bélgica", ground_cost: 55, ground_time: "~3h30: autocarro Flibco até Bruxelas-Midi (~19 €) + Eurocity Direct"}

# Aeroportos onde também se pesquisa ida e volta na mesma companhia (por vezes mais barato
# que duas idas soltas nas companhias tradicionais). Cada um custa 1 pesquisa por par de datas.
roundtrip_airports: [AMS]

dates:
  # Janelas de datas (inclusive). O script testa todas as combinações ida/volta
  # que respeitem o nº de noites abaixo.
  outbound: [2027-04-23, 2027-04-26]   # 23 = sexta, só a partir das 19h, depois do trabalho (ver abaixo)
  return:   [2027-04-28, 2027-05-01]   # 1 mai = sábado
  min_nights: 2
  max_nights: 8
  # Hora mínima de partida da ida, por dia (os outros dias: qualquer hora).
  earliest_departure:
    "2027-04-23": 19

search:
  passengers: 2          # só serve para mostrar o total estimado nas mensagens
  currency: EUR
  max_stops: 1           # null = sem limite
  carry_on_bags: 0       # low-cost: bagagem de mão grande/porão muda o preço, ajusta aqui
  checked_bags: 0
  delay_seconds: 3       # pausa entre pesquisas (não abuses do Google)
  explore_workers: 6     # /explorar: pesquisas em paralelo (são muitos destinos)

alerts:
  # Total por pessoa: voo de ida + voo de volta + comboio/autocarro até Amesterdão (ida e volta).
  max_price_per_person: 180
  min_drop_to_realert: 5       # só volta a alertar as mesmas datas se baixar >= 5 EUR
  summary_top_n: 5

# Segurança para não fazer pesquisas a mais por execução.
max_queries_per_run: 100

# /explorar: destinos testados (cidade -> aeroportos). Cada aeroporto custa 2 pesquisas
# por fim de semana / par de datas, por isso a lista fica curta e com os mais servidos do Porto.
explore:
  Madrid: [MAD]
  Barcelona: [BCN]
  Sevilha: [SVQ]
  Palma: [PMI]
  Londres: [STN, LGW]
  Paris: [ORY, BVA]
  Roma: [FCO, CIA]
  Milão: [BGY]
  Veneza: [VCE]
  Nápoles: [NAP]
  Amesterdão: [AMS, EIN]
  Bruxelas: [CRL, BRU]
  Berlim: [BER]
  Dublin: [DUB]
  Edimburgo: [EDI]
  Genebra: [GVA]
  Basileia: [BSL]
  Praga: [PRG]
  Budapeste: [BUD]
  Cracóvia: [KRK]
  Viena: [VIE]
  Marraquexe: [RAK]
  Nice: [NCE]
  Luxemburgo: [LUX]
  Malta: [MLA]
